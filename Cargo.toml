[workspace]
resolver = "3"
members = [
    "crates/fbx",
    "crates/armature",
    "crates/mesh",
    "crates/pose",
    "crates/input",
    "crates/gltf",
    "crates/unity-yaml",
    "crates/unity-asset",
    "crates/vpm",
    "crates/vrc-descriptor",
    "crates/lint",
    "crates/stats",
    "crates/anim-gen",
    "crates/osc",
    "crates/osc-gestures",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"
repository = "https://github.com/AndrewAltimit/avatar"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.11"
# Linear algebra for the runtime rig layer (pose/skinning/IK/input). f32 to match the GPU.
glam = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
