[workspace]
resolver = "3"
members = [
    "crates/fbx",
    "crates/armature",
    "crates/mesh",
    "crates/pose",
    "crates/input",
    "crates/gltf",
    "crates/unity-yaml",
    "crates/unity-asset",
    "crates/unitypackage",
    "crates/vpm",
    "crates/vrc-descriptor",
    "crates/lint",
    "crates/stats",
    "crates/anim-gen",
    "crates/migrate",
    "crates/render",
    "crates/osc",
    "crates/osc-gestures",
    "crates/mcp",
    "crates/cli",
    "crates/testkit",
    "crates/web-analyzer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"
repository = "https://github.com/AndrewAltimit/avatar"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema generation for the report types, so an agent can introspect `--json` output shapes
# (`avatar schema …`). Optional + feature-gated per crate (the `schema` feature) to keep library
# consumers lean; the cli turns it on by default.
schemars = "0.8"
yaml-rust2 = "0.11"
# Linear algebra for the runtime rig layer (pose/skinning/IK/input). f32 to match the GPU.
glam = "0.29"
# `.unitypackage` is a gzip-compressed tar; these are the idiomatic readers (used only by
# `avatar-unitypackage`). flate2 is already in the graph transitively via fbxcel.
flate2 = "1"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
