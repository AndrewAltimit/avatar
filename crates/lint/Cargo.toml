[package]
name = "avatar-lint"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "avatar_lint"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
schemars = { workspace = true, optional = true }
avatar-unity-yaml = { path = "../unity-yaml" }
avatar-unity-asset = { path = "../unity-asset" }
avatar-vpm = { path = "../vpm" }
avatar-vrc-descriptor = { path = "../vrc-descriptor" }

[features]
# Derive `schemars::JsonSchema` on the report types so consumers can emit a JSON Schema for them.
schema = ["dep:schemars"]

[dev-dependencies]
# Golden-snapshot harness + the shared fixture corpus resolver.
avatar-testkit = { path = "../testkit" }
serde_json.workspace = true
