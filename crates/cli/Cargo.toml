[package]
name = "avatar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "avatar"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# Linear algebra for the render command's scene glue (placement/camera). Confined to render_scene.rs.
glam.workspace = true
# Unity YAML reader, used by the render command's world-scene parser.
avatar-unity-yaml = { path = "../unity-yaml" }
yaml-rust2.workspace = true
avatar-fbx = { path = "../fbx" }
avatar-armature = { path = "../armature" }
avatar-gltf = { path = "../gltf" }
avatar-mesh = { path = "../mesh" }
avatar-pose = { path = "../pose" }
avatar-render = { path = "../render" }
avatar-lint = { path = "../lint" }
avatar-stats = { path = "../stats" }
avatar-unitypackage = { path = "../unitypackage" }
avatar-anim-gen = { path = "../anim-gen" }
avatar-osc = { path = "../osc" }
avatar-osc-gestures = { path = "../osc-gestures" }
# Decode texture images (PNG/JPEG/TGA/BMP/GIF) for the render command. Default features off to keep
# the format set lean; these cover Unity project + FBX-embedded textures in practice.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif"] }

[features]
# On by default so `avatar view` (the interactive window) works out of the box. winit builds fine
# headlessly — it only needs a display at runtime — so CI builds stay green. Disable with
# `--no-default-features` for a pure-offscreen build with no windowing deps.
default = ["viewer"]
viewer = ["avatar-render/viewer"]

[dev-dependencies]
# Used only to synthesize binary FBX fixtures in-memory for the CLI exit-code tests.
fbxcel = { version = "0.9", features = ["tree", "writer"] }
