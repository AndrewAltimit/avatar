[package]
name = "avatar-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "avatar_render"

[dependencies]
anyhow.workspace = true
glam.workspace = true
# GPU-side only (this crate owns the draw). wgpu 29 = the validated offscreen Vulkan path.
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
# Interactive windowed viewer (feature `viewer`); the offscreen PNG path needs none of this.
winit = { version = "0.30", optional = true }

[features]
# `avatar view` — opens a native orbit/walk window. Off by default so headless/CI builds and the
# offscreen render need no windowing/display dependencies.
viewer = ["dep:winit"]
