[package]
name = "avatar-stats"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "avatar_stats"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
schemars = { workspace = true, optional = true }
avatar-fbx = { path = "../fbx" }
avatar-mesh = { path = "../mesh" }
avatar-unity-yaml = { path = "../unity-yaml" }
avatar-vpm = { path = "../vpm" }
avatar-vrc-descriptor = { path = "../vrc-descriptor" }

[features]
# Derive `schemars::JsonSchema` on the report types so consumers can emit a JSON Schema for them.
schema = ["dep:schemars"]

[dev-dependencies]
# Used only to synthesize binary FBX fixtures in-memory for the geometry-stats tests
# (same approach as the avatar-cli exit-code tests — no committed asset needed).
fbxcel = { version = "0.9", features = ["tree", "writer"] }
# Golden-snapshot harness + shared corpus resolver + in-code synthetic FBX (the `fbx` feature).
avatar-testkit = { path = "../testkit", features = ["fbx"] }
serde_json.workspace = true
