[package]
name = "avatar-armature"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "avatar_armature"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
schemars = { workspace = true, optional = true }
avatar-fbx = { path = "../fbx" }

[features]
# Derive `schemars::JsonSchema` on the report types so consumers can emit a JSON Schema for them.
schema = ["dep:schemars"]

[dev-dependencies]
# Used only to synthesize a binary FBX in-memory for the non-gated write-back test.
fbxcel = { version = "0.9", features = ["tree", "writer"] }
