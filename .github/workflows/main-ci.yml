---
# CI + GitHub Pages deploy for the avatar tools repo.
# Modeled on legend-of-legaia-re/.github/workflows/main-ci.yml (same self-hosted
# runner convention). Tailored to this repo:
#   - No WASM build: the site here is static HTML generated by a Python script
#     (site/_gen.py), so the deploy-pages job just runs that and uploads site/.
#   - The disc-gated suite there maps to this repo's AVATAR_SAMPLE_FBX-gated
#     integration tests: a separate `sample-test` job runs them on demand. The
#     main `ci` job leaves AVATAR_SAMPLE_FBX unset on purpose — those tests then
#     print a skip notice and pass, since this repo ships no sample FBX.
#   - cargo runs directly on the runner.
#
# Runners: every job targets `self-hosted`. The runner(s) must have Rust
# (cargo/rustup) and python3 available; the `deploy-pages` job needs no extra
# toolchain beyond python3.
#
# The `sample-test` job fires on (a) manual workflow_dispatch, or (b) a PR that
# has the `sample-test` label added. Set the `AVATAR_SAMPLE_FBX` repository
# variable (Settings > Variables > Actions) to a sample FBX path on the runner.

name: Main CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -- Cargo CI ---------------------------------------------------------------
  ci:
    name: Avatar CI
    runs-on: self-hosted
    timeout-minutes: 30
    # Don't run the full CI on PR label events - that trigger is reserved for
    # the sample-test job below. CI still runs on push-to-main and dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Toolchain info
        run: rustup show

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

  # -- Sample-Gated Test Suite ------------------------------------------------
  sample-test:
    name: Sample-Gated Tests
    runs-on: self-hosted
    timeout-minutes: 45
    # Runs on:
    #   (a) manual workflow_dispatch (any branch), OR
    #   (b) a pull_request where the `sample-test` label was just added.
    # Requires the `AVATAR_SAMPLE_FBX` repository variable to point at a sample
    # FBX on the self-hosted runner (Settings > Variables > Actions). The
    # integration tests under crates/*/tests/ pick it up via this env var.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'sample-test'))
    env:
      AVATAR_SAMPLE_FBX: ${{ vars.AVATAR_SAMPLE_FBX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify sample FBX exists
        run: |
          if [ -z "$AVATAR_SAMPLE_FBX" ]; then
            echo "ERROR: AVATAR_SAMPLE_FBX repository variable is not set."
            echo "Configure it under Settings > Variables > Actions on GitHub."
            exit 1
          fi
          if [ ! -f "$AVATAR_SAMPLE_FBX" ]; then
            echo "ERROR: sample FBX not found at '$AVATAR_SAMPLE_FBX'"
            exit 1
          fi
          echo "Sample FBX present: $AVATAR_SAMPLE_FBX"

      - name: Run sample-gated test suite
        run: cargo test --workspace

  # -- Deploy GitHub Pages ----------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate site pages
        run: python3 site/_gen.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -- CI Summary -------------------------------------------------------------
  notify:
    name: CI Summary
    needs: [ci, deploy-pages, sample-test]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate summary
        run: |
          echo "## Main CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ needs.ci.result == 'success' && 'pass' || needs.ci.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages | ${{ needs.deploy-pages.result == 'success' && 'pass' || needs.deploy-pages.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sample Tests | ${{ needs.sample-test.result == 'success' && 'pass' || needs.sample-test.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.ci.result }}" == "failure" || "${{ needs.sample-test.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI failed - please review the logs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
