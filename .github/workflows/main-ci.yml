---
# CI + GitHub Pages deploy for the avatar tools repo.
# Modeled on legend-of-legaia-re/.github/workflows/main-ci.yml (same self-hosted
# runner convention). Tailored to this repo:
#   - No WASM build: the site here is static HTML generated by a Python script
#     (site/_gen.py), so the deploy-pages job just runs that and uploads site/.
#   - Ground truth on every push: the runner *is* the dev machine, so the main
#     `ci` job points `AVATAR_SAMPLE_UNITYPACKAGE` at a real avatar package on
#     local disk. That turns the otherwise-skipped real-FBX-parse and
#     `.unitypackage` open/extract integration tests into real, every-push
#     coverage (the lint / project-stats read paths are already covered on every
#     push by the committed synthetic fixtures under fixtures/projects).
#     Paths default to this machine's local files but are overridable via repo
#     variables; if a path is absent the tests self-skip, so forks stay green.
#   - The heavier world cross-check (a ~700 MB world package) stays on the
#     on-demand `sample-test` job.
#   - cargo runs directly on the runner.
#
# Runners: every job targets `self-hosted`. The runner(s) must have Rust
# (cargo/rustup) and python3 available; the `deploy-pages` job needs no extra
# toolchain beyond python3.
#
# The `sample-test` job fires on (a) manual workflow_dispatch, or (b) a PR that
# has the `sample-test` label added. Override any sample path with the matching
# repository variable (Settings > Variables > Actions): AVATAR_SAMPLE_UNITYPACKAGE,
# AVATAR_SAMPLE_UNITYPACKAGE_WORLD, AVATAR_SAMPLE_FBX.

name: Main CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -- Cargo CI ---------------------------------------------------------------
  ci:
    name: Avatar CI
    runs-on: self-hosted
    timeout-minutes: 30
    # Don't run the full CI on PR label events - that trigger is reserved for
    # the sample-test job below. CI still runs on push-to-main and dispatch.
    if: github.event_name != 'pull_request'
    env:
      # Ground-truth fixture on the self-hosted runner (this same machine). The env-gated
      # integration tests (crates/cli/tests/sample_avatar_pipeline.rs, crates/unitypackage/tests/
      # sample_package.rs) extract + parse this real avatar package on every push. Override via the
      # repo variable; if the path is absent the tests self-skip, so forks/other machines stay green.
      AVATAR_SAMPLE_UNITYPACKAGE: ${{ vars.AVATAR_SAMPLE_UNITYPACKAGE || '/home/mikunpc/Documents/avatar/mikunpc-sdk2.unitypackage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Toolchain info
        run: rustup show

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

  # -- Hosted-Runner Fallback ---------------------------------------------------
  # The main `ci` job runs on the single self-hosted runner (the dev machine).
  # This job is the redundancy: the same fmt/clippy/test gates on a GitHub-hosted
  # runner, against the committed synthetic fixtures only (the env-gated
  # real-sample tests self-skip). If the self-hosted runner is down, this still
  # verifies every push.
  ci-hosted:
    name: Avatar CI (hosted fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hosted-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test (synthetic fixtures only)
        run: cargo test --workspace

  # -- Sample-Gated Test Suite ------------------------------------------------
  sample-test:
    name: Sample-Gated Tests
    runs-on: self-hosted
    timeout-minutes: 45
    # Runs on:
    #   (a) manual workflow_dispatch (any branch), OR
    #   (b) a pull_request where the `sample-test` label was just added.
    # Requires the `AVATAR_SAMPLE_FBX` repository variable to point at a sample
    # FBX on the self-hosted runner (Settings > Variables > Actions). The
    # integration tests under crates/*/tests/ pick it up via this env var.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'sample-test'))
    env:
      # The on-demand job adds the heavy world package (so the avatar-vs-world co-import cross-check
      # in sample_package.rs runs) and a standalone FBX, on top of the avatar package. Each defaults
      # to this machine's local file and is overridable via the matching repo variable; the tests
      # self-skip on any path that is absent.
      AVATAR_SAMPLE_UNITYPACKAGE: ${{ vars.AVATAR_SAMPLE_UNITYPACKAGE || '/home/mikunpc/Documents/avatar/mikunpc-sdk2.unitypackage' }}
      AVATAR_SAMPLE_UNITYPACKAGE_WORLD: ${{ vars.AVATAR_SAMPLE_UNITYPACKAGE_WORLD || '/home/mikunpc/Documents/world/Cozy Cabin/PC.unitypackage' }}
      AVATAR_SAMPLE_FBX: ${{ vars.AVATAR_SAMPLE_FBX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Report sample fixtures
        # Informational only — the integration tests self-skip any fixture that is absent, so a
        # missing path is not a hard failure here.
        run: |
          for v in AVATAR_SAMPLE_UNITYPACKAGE AVATAR_SAMPLE_UNITYPACKAGE_WORLD AVATAR_SAMPLE_FBX; do
            p="${!v}"
            if [ -n "$p" ] && [ -e "$p" ]; then
              echo "present: $v=$p"
            else
              echo "absent (tests will skip): $v=${p:-<unset>}"
            fi
          done

      - name: Run sample-gated test suite
        run: cargo test --workspace

  # -- Deploy GitHub Pages ----------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate site pages
        run: python3 site/_gen.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -- CI Summary -------------------------------------------------------------
  notify:
    name: CI Summary
    needs: [ci, deploy-pages, sample-test]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate summary
        run: |
          echo "## Main CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ needs.ci.result == 'success' && 'pass' || needs.ci.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages | ${{ needs.deploy-pages.result == 'success' && 'pass' || needs.deploy-pages.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sample Tests | ${{ needs.sample-test.result == 'success' && 'pass' || needs.sample-test.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.ci.result }}" == "failure" || "${{ needs.sample-test.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI failed - please review the logs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
